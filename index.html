<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100,000 Recipe Finder</title>

<style>
*{box-sizing:border-box}

:root{
  --page:#fff8ef;
  --text:#30251f;
  --card:#fff;
  --border:#ffe0ca;
  --muted:#71584c;
  --heading:#733b29;
  --badge:#fff0df;
  --badge-text:#a44f27;
  --input:#fff;
  --input-border:#ffd1b8;
  --modal-info:#fff8ef;
  --button:#ff704d;
  --button-hover:#e85836;
}

body.dark-mode{
  --page:#171717;
  --text:#f2e9e2;
  --card:#262626;
  --border:#494039;
  --muted:#c2b4aa;
  --heading:#ffb18d;
  --badge:#44342b;
  --badge-text:#ffd0ad;
  --input:#292929;
  --input-border:#635044;
  --modal-info:#33302d;
  --button:#e96849;
  --button-hover:#ff805d;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--page);
  color:var(--text);
  transition:background .25s,color .25s;
}

header{
  background:linear-gradient(135deg,#ff704d,#ffb347);
  color:white;
  text-align:center;
  padding:32px 16px;
}

header h1{margin:0 0 8px;font-size:38px}
header p{margin:0;font-size:17px}

.theme-button{
  margin-top:18px;
  padding:11px 18px;
  border:2px solid white;
  border-radius:25px;
  background:rgba(255,255,255,.18);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.theme-button:hover{background:rgba(255,255,255,.3)}

.controls{
  max-width:1250px;
  margin:24px auto 10px;
  padding:0 16px;
  display:grid;
  grid-template-columns:2fr repeat(4,1fr);
  gap:12px;
}

input,select{
  width:100%;
  padding:14px;
  border:2px solid var(--input-border);
  border-radius:10px;
  font-size:16px;
  background:var(--input);
  color:var(--text);
}

input:focus,select:focus{
  outline:3px solid rgba(255,112,77,.25);
  border-color:#ff704d;
}

.recipe-count{
  max-width:1250px;
  margin:12px auto 20px;
  padding:0 16px;
  font-weight:bold;
  color:#c16b45;
}

#recipeGrid{
  max-width:1250px;
  margin:auto;
  padding:0 16px 20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.recipe-card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(90,50,20,.12);
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  transition:background .25s,border-color .25s;
}

.recipe-image{
  height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  background:var(--badge);
}

.recipe-content{
  padding:18px;
  display:flex;
  flex-direction:column;
  flex-grow:1;
}

.recipe-content h2{
  margin:0 0 12px;
  font-size:20px;
  color:var(--heading);
  line-height:1.3;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:12px;
}

.badge{
  display:inline-block;
  width:fit-content;
  padding:5px 9px;
  background:var(--badge);
  color:var(--badge-text);
  border-radius:20px;
  font-size:12px;
}

.details{
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
  margin-bottom:15px;
}

.view-button{
  margin-top:auto;
  padding:12px;
  border:none;
  border-radius:9px;
  background:var(--button);
  color:white;
  font-size:15px;
  cursor:pointer;
  font-weight:bold;
}

.view-button:hover{background:var(--button-hover)}

#loadMoreButton{
  display:none;
  margin:10px auto 40px;
  padding:13px 28px;
  border:none;
  border-radius:10px;
  background:#733b29;
  color:white;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
}

#loadMoreButton:hover{background:#4f281d}

#noResults{
  display:none;
  max-width:600px;
  margin:50px auto;
  text-align:center;
  padding:30px;
  font-size:20px;
  color:var(--muted);
}

.modal-background{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  justify-content:center;
  align-items:center;
  padding:18px;
  z-index:10;
}

.modal{
  background:var(--card);
  color:var(--text);
  max-width:700px;
  width:100%;
  max-height:90vh;
  overflow-y:auto;
  border-radius:18px;
  padding:28px;
  position:relative;
}

.close-button{
  position:absolute;
  right:18px;
  top:14px;
  border:none;
  background:var(--badge);
  color:var(--badge-text);
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:22px;
  cursor:pointer;
}

.close-button:hover{opacity:.75}

.modal h2{
  color:var(--heading);
  margin-top:0;
  padding-right:40px;
  line-height:1.3;
}

.modal h3{
  color:var(--badge-text);
  border-bottom:2px solid var(--border);
  padding-bottom:7px;
  margin-top:25px;
}

.modal li{
  margin:9px 0;
  line-height:1.5;
}

.modal-info{
  background:var(--modal-info);
  border-radius:10px;
  padding:14px;
  line-height:1.8;
}

@media(max-width:1100px){
  .controls{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  header h1{font-size:30px}
  .controls{grid-template-columns:1fr}
  #recipeGrid{grid-template-columns:1fr}
  .modal{padding:22px}
}
</style>
</head>

<body>

/*

  x 10 flavor twists
  x 100 recipe versions
  = 100,000 recipes
*/

const recipeTypeInfo = {

const baseRecipes = [
["Garlic Spaghetti","Spaghetti"],["Tomato Spaghetti","Spaghetti"],["Meatball Spaghetti","Spaghetti"],["Pesto Spaghetti","Spaghetti"],
["Chicken Pasta","Pasta"],["Alfredo Pasta","Pasta"],["Vegetable Pasta","Pasta"],["Baked Pasta","Pasta"],
["Chicken Noodles","Noodles"],["Beef Noodles","Noodles"],["Sesame Noodles","Noodles"],["Vegetable Noodles","Noodles"],

["Berry Parfait","Desserts"],["Rice Pudding","Desserts"],["Fruit Trifle","Desserts"],["Chia Pudding","Desserts"],
["Fruit Smoothie","Drinks"],["Berry Lemonade","Drinks"],["Iced Tea","Drinks"],["Hot Chocolate","Drinks"],
["Hummus Plate","Snacks"],["Mango Salsa","Snacks"],["Peanut Butter Bites","Snacks"],["Trail Mix","Snacks"],
["Lentil Curry","Curry"],["Chicken Curry","Curry"],["Vegetable Curry","Curry"],["Chickpea Curry","Curry"],
["Baked Potatoes","Potatoes"],["Potato Wedges","Potatoes"],["Mashed Potatoes","Potatoes"],["Potato Hash","Potatoes"],
["Strawberry Cake","Cakes"],["Chocolate Cake","Cakes"],["Carrot Cake","Cakes"],["Lemon Cake","Cakes"],
["Vegetable Stir Fry","Stir Fry"],["Chicken Stir Fry","Stir Fry"],["Beef Stir Fry","Stir Fry"],["Tofu Stir Fry","Stir Fry"],
["Beef Burger","Burgers"],["Chicken Burger","Burgers"],["Veggie Burger","Burgers"],["Bean Burger","Burgers"],

["Beef Stew","Beef"],["Beef Skillet","Beef"],["Roast Beef","Beef"],["Beef Fajitas","Beef"],
["Chocolate Cookies","Cookies"],["Oatmeal Cookies","Cookies"],["Sugar Cookies","Cookies"],["Peanut Butter Cookies","Cookies"],
["Banana Smoothie","Smoothies"],["Mango Smoothie","Smoothies"],["Green Smoothie","Smoothies"],["Peach Smoothie","Smoothies"]
].map(function(item){return {name:item[0],type:item[1]};});

const flavorTwists = [
{name:"Classic",ingredient:"a pinch of salt",step:"Taste and add salt if needed."},
{name:"Lemon Herb",ingredient:"1 tablespoon lemon juice and fresh herbs",step:"Finish with lemon juice and fresh herbs."},
{name:"Spicy",ingredient:"1/2 teaspoon chili flakes",step:"Add chili flakes for a spicy flavor."},
{name:"Cheesy",ingredient:"1/2 cup extra shredded cheese",step:"Add the extra cheese before serving."},
{name:"Smoky",ingredient:"1 teaspoon smoked paprika",step:"Stir in smoked paprika for a smoky flavor."},
{name:"Garlic Herb",ingredient:"2 extra garlic cloves and fresh parsley",step:"Add garlic and parsley near the end."},
{name:"Honey Glazed",ingredient:"1 tablespoon honey",step:"Drizzle honey over the finished recipe."},
{name:"Creamy",ingredient:"1/3 cup cooking cream",step:"Stir in the cream until smooth."},
{name:"Crunchy",ingredient:"1/2 cup toasted breadcrumbs",step:"Add toasted breadcrumbs before serving."},
{name:"Fresh Garden",ingredient:"1/2 cup chopped fresh vegetables",step:"Add the fresh vegetables just before serving."}
];

const versionFamilies=["Family Style","Quick","Light","Protein Plus","Garden","Weekend","Budget","Lunchbox","Party","Holiday"];
const versionQualities=["Home","Fresh","Simple","Deluxe","Healthy","Golden","Classic","Special","Favorite","Everyday"];
const recipeVersions=[];

versionFamilies.forEach(function(family,familyIndex){
  versionQualities.forEach(function(quality,qualityIndex){
    recipeVersions.push({
      name:quality+" "+family,
      ingredient:"one extra ingredient for the "+quality.toLowerCase()+" "+family.toLowerCase()+" version",
      step:"Finish and serve the "+quality.toLowerCase()+" "+family.toLowerCase()+" version.",
      extraTime:familyIndex+qualityIndex
    });
  });
});

const recipes=[];

baseRecipes.forEach(function(base,baseIndex){
  const info=recipeTypeInfo[base.type];

  flavorTwists.forEach(function(twist,twistIndex){
    recipeVersions.forEach(function(version,versionIndex){
      const id=baseIndex*1000+twistIndex*100+versionIndex+1;

      recipes.push({
        id:id,
        name:twist.name+" "+version.name+" "+base.name,
        type:base.type,
        category:info.category,
        emoji:info.emoji,
        time:info.time+twistIndex+version.extraTime,
        servings:info.servings,
        difficulty:info.difficulty,
        ingredients:info.ingredients.concat([twist.ingredient,version.ingredient]),
        steps:info.steps.concat([twist.step,version.step])
      });
    });
  });
});

console.log("Total recipes:",recipes.length);

const recipeGrid=document.getElementById("recipeGrid");
const searchInput=document.getElementById("searchInput");
const categoryFilter=document.getElementById("categoryFilter");
const typeFilter=document.getElementById("typeFilter");
const difficultyFilter=document.getElementById("difficultyFilter");
const sortSelect=document.getElementById("sortSelect");
const recipeCount=document.getElementById("recipeCount");
const loadMoreButton=document.getElementById("loadMoreButton");
const noResults=document.getElementById("noResults");
const modalBackground=document.getElementById("modalBackground");
const modalContent=document.getElementById("modalContent");
const closeButton=document.getElementById("closeButton");
const themeToggle=document.getElementById("themeToggle");

let visibleRecipeLimit=120;
let currentFilteredRecipes=[];

/* LIGHT AND DARK MODE */

function applyTheme(theme){
  document.body.classList.toggle("dark-mode",theme==="dark");
  themeToggle.textContent=theme==="dark"?"☀️ Light Mode":"🌙 Dark Mode";
  localStorage.setItem("recipeFinderTheme",theme);
}

const savedTheme=localStorage.getItem("recipeFinderTheme")||"light";
applyTheme(savedTheme);

themeToggle.addEventListener("click",function(){
  const newTheme=document.body.classList.contains("dark-mode")?"light":"dark";
  applyTheme(newTheme);
});

/* HTML SAFETY */

function escapeHTML(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* FILTER AND SORT RECIPES */

function getFilteredRecipes(){
  const searchText=searchInput.value.trim().toLowerCase();
  const selectedCategory=categoryFilter.value;
  const selectedType=typeFilter.value;
  const selectedDifficulty=difficultyFilter.value;
  const selectedSort=sortSelect.value;

  let filtered=recipes.filter(function(recipe){
    const searchableText=[
      recipe.name,
      recipe.type,
      recipe.category,
      recipe.ingredients.join(" "),
      recipe.steps.join(" ")
    ].join(" ").toLowerCase();

    const matchesSearch=searchableText.includes(searchText);
    const matchesCategory=selectedCategory==="All"||recipe.category===selectedCategory;
    const matchesType=selectedType==="All"||recipe.type===selectedType;
    const matchesDifficulty=selectedDifficulty==="All"||recipe.difficulty===selectedDifficulty;

    return matchesSearch&&matchesCategory&&matchesType&&matchesDifficulty;
  });

  filtered.sort(function(a,b){
    if(selectedSort==="time")return a.time-b.time;

    if(selectedSort==="difficulty"){
      const order={Easy:1,Medium:2,Hard:3};
      return order[a.difficulty]-order[b.difficulty];
    }

    return a.name.localeCompare(b.name);
  });

  return filtered;
}

/* DISPLAY RECIPE CARDS */

function displayRecipes(){
  currentFilteredRecipes=getFilteredRecipes();
  recipeGrid.innerHTML="";

  recipeCount.textContent=
    "Showing "+Math.min(visibleRecipeLimit,currentFilteredRecipes.length)+
    " of "+currentFilteredRecipes.length+
    " matching recipes out of "+recipes.length+" total recipes";

  if(currentFilteredRecipes.length===0){
    noResults.style.display="block";
    loadMoreButton.style.display="none";
    return;
  }

  noResults.style.display="none";

  const recipesToDisplay=currentFilteredRecipes.slice(0,visibleRecipeLimit);

  recipesToDisplay.forEach(function(recipe){
    const card=document.createElement("article");
    card.className="recipe-card";

    card.innerHTML=`
      <div class="recipe-image">${escapeHTML(recipe.emoji)}</div>
      <div class="recipe-content">
        <div class="badges">
          <span class="badge">${escapeHTML(recipe.category)}</span>
          <span class="badge">${escapeHTML(recipe.type)}</span>
          <span class="badge">${escapeHTML(recipe.difficulty)}</span>
        </div>
        <h2>${escapeHTML(recipe.name)}</h2>
        <div class="details">
          ⏱ ${escapeHTML(recipe.time)} minutes<br>
          👥 Serves ${escapeHTML(recipe.servings)}<br>
          ⭐ ${escapeHTML(recipe.difficulty)}<br>
          🔢 Recipe #${escapeHTML(recipe.id)}
        </div>
        <button class="view-button" data-id="${escapeHTML(recipe.id)}">
          View Recipe
        </button>
      </div>
    `;

    recipeGrid.appendChild(card);
  });

  loadMoreButton.style.display=
    visibleRecipeLimit<currentFilteredRecipes.length?"block":"none";

  document.querySelectorAll(".view-button").forEach(function(button){
    button.addEventListener("click",function(){
      openRecipe(Number(button.dataset.id));
    });
  });
}

/* OPEN RECIPE DETAILS */

function openRecipe(recipeId){
  const recipe=recipes.find(function(item){return item.id===recipeId;});
  if(!recipe)return;

  const ingredientList=recipe.ingredients.map(function(ingredient){
    return "<li>"+escapeHTML(ingredient)+"</li>";
  }).join("");

  const stepList=recipe.steps.map(function(step,index){
    return "<li><strong>Step "+(index+1)+":</strong> "+escapeHTML(step)+"</li>";
  }).join("");

  modalContent.innerHTML=`
    <h2>${escapeHTML(recipe.emoji)} ${escapeHTML(recipe.name)}</h2>

    <div class="modal-info">
      <strong>Recipe number:</strong> ${escapeHTML(recipe.id)}<br>
      <strong>Type:</strong> ${escapeHTML(recipe.type)}<br>
      <strong>Category:</strong> ${escapeHTML(recipe.category)}<br>
      <strong>Cooking time:</strong> ${escapeHTML(recipe.time)} minutes<br>
      <strong>Servings:</strong> ${escapeHTML(recipe.servings)}<br>
      <strong>Difficulty:</strong> ${escapeHTML(recipe.difficulty)}
    </div>

    <h3>Ingredients</h3>
    <ul>${ingredientList}</ul>

    <h3>Instructions</h3>
    <ol>${stepList}</ol>
  `;

  modalBackground.style.display="flex";
}

function closeRecipe(){
  modalBackground.style.display="none";
}

function resetVisibleLimit(){
  visibleRecipeLimit=120;
  displayRecipes();
}

/* EVENT LISTENERS */

searchInput.addEventListener("input",resetVisibleLimit);
categoryFilter.addEventListener("change",resetVisibleLimit);
typeFilter.addEventListener("change",resetVisibleLimit);
difficultyFilter.addEventListener("change",resetVisibleLimit);
sortSelect.addEventListener("change",resetVisibleLimit);

loadMoreButton.addEventListener("click",function(){
  visibleRecipeLimit+=120;
  displayRecipes();
});

closeButton.addEventListener("click",closeRecipe);

modalBackground.addEventListener("click",function(event){
  if(event.target===modalBackground)closeRecipe();
});

document.addEventListener("keydown",function(event){
  if(event.key==="Escape")closeRecipe();
});

/* START WEBSITE */

displayRecipes();
</script>

</body>
</html>
