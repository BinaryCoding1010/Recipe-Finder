    }

      font-size: 17px;
    }

      margin: 24px auto 10px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 2fr repeat(3, 1fr);
      gap: 12px;
    }

    select {

      font-size: 16px;
      background: white;

      padding: 0 16px;
      font-weight: bold;
      color: #8c4a32
;
    }

    #recipeGrid {
      max-width: 1250px;
      margin: auto;
      padding: 0 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .recipe-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(90, 50, 20, 0.12);
      border: 1px solid #ffe0ca
;
      display: flex;
      flex-direction: column;
    }

    .recipe-image {
      height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
      background: #ffe5d1
;
    }

    .recipe-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .recipe-content h2 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #733b29
;
      line-height: 1.3;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      width: fit-content;
      padding: 5px 9px;
      background: #fff0df
;
      color: #a44f27
;
      border-radius: 20px;
      font-size: 12px;
    }

    .details {
      color: #71584c
;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 15px;
    }

    .view-button {
      margin-top: auto;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #ff704d
;
      color: white;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .view-button:hover {
      background: #e85836
;
    }

      display: none;
      margin: 10px auto 40px;
      padding: 13px 28px;
      border: none;
      border-radius: 10px;
      background: #733b29
;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    #loadMoreButton:hover {
      background: #4f281d
;
    }

      max-width: 600px;
      margin: 50px auto;
      text-align: center;
      padding: 30px;
      font-size: 20px;
      color: #805442
;
    }

      display: none;
      position: fixed;
      inset: 0;
      background: rgba(35, 20, 10, 0.65);
      justify-content: center;
      align-items: center;
      padding: 18px;
      z-index: 10;

      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 28px;
      position: relative;

      top: 14px;
      border: none;
      background: #ffe8dc
;

      }

      }

      .modal {
        padding: 22px;
      }
    }

</head>

      { name: "Herb Chicken", type: "Chicken" },

      { name: "Beef Stew", type: "Beef" },
      { name: "Beef Skillet", type: "Beef" },
      { name: "Roast Beef", type: "Beef" },
      { name: "Beef Fajitas", type: "Beef" },

      { name: "Chocolate Cookies", type: "Cookies" },
      { name: "Oatmeal Cookies", type: "Cookies" },
      { name: "Sugar Cookies", type: "Cookies" },
      { name: "Peanut Butter Cookies", type: "Cookies" },

      { name: "Banana Smoothie", type: "Smoothies" },
      { name: "Mango Smoothie", type: "Smoothies" },
      { name: "Green Smoothie", type: "Smoothies" },
      { name: "Peach Smoothie", type: "Smoothies" }
    ];

    const flavorTwists = [
      {
        name: "Classic",
        ingredient: "a pinch of salt",
        step: "Taste and add salt if needed."
      },
      {
        name: "Lemon Herb",
        ingredient: "1 tablespoon lemon juice and fresh herbs",
        step: "Finish with lemon juice and fresh herbs."
      },
      {
        name: "Spicy",
        ingredient: "1/2 teaspoon chili flakes",
        step: "Add chili flakes for a spicy flavor."
      },
      {
        name: "Cheesy",
        ingredient: "1/2 cup extra shredded cheese",
        step: "Add the extra cheese before serving."
      },
      {
        name: "Smoky",
        ingredient: "1 teaspoon smoked paprika",
        step: "Stir in smoked paprika for a smoky flavor."
      },
      {
        name: "Garlic Herb",
        ingredient: "2 extra garlic cloves and fresh parsley",
        step: "Add garlic and parsley near the end."
      },
      {
        name: "Honey Glazed",
        ingredient: "1 tablespoon honey",
        step: "Drizzle honey over the finished recipe."
      },
      {
        name: "Creamy",
        ingredient: "1/3 cup cooking cream",
        step: "Stir in the cream until smooth."
      },
      {
        name: "Crunchy",
        ingredient: "1/2 cup toasted breadcrumbs",
        step: "Add toasted breadcrumbs before serving."
      },
      {
        name: "Fresh Garden",
        ingredient: "1/2 cup chopped fresh vegetables",
        step: "Add the fresh vegetables just before serving."
      }
    ];

    /*
      10 version families x 10 version qualities = 100 versions.
    */

    const versionFamilies = [
      "Family Style",
      "Quick",
      "Light",
      "Protein Plus",
      "Garden",
      "Weekend",
      "Budget",
      "Lunchbox",
      "Party",
      "Holiday"
    ];

    const versionQualities = [
      "Home",
      "Fresh",
      "Simple",
      "Deluxe",
      "Healthy",
      "Golden",
      "Classic",
      "Special",
      "Favorite",
      "Everyday"
    ];

    const recipeVersions = [];

    versionFamilies.forEach(function(family, familyIndex) {
      versionQualities.forEach(function(quality, qualityIndex) {
        recipeVersions.push({
          name: quality + " " + family,
          ingredient:
            "one extra ingredient for the " +
            quality.toLowerCase() +
            " " +
            family.toLowerCase() +
            " version",
          step:
            "Finish and serve the " +
            quality.toLowerCase() +
            " " +
            family.toLowerCase() +
            " version.",
          extraTime: familyIndex + qualityIndex
        });
      });
    });

    const recipes = [];

    baseRecipes.forEach(function(base, baseIndex) {
      const typeInfo = recipeTypeInfo[base.type];

      flavorTwists.forEach(function(twist, twistIndex) {
        recipeVersions.forEach(function(version, versionIndex) {
          const recipeNumber =
            baseIndex * 1000 +
            twistIndex * 100 +
            versionIndex +
            1;

          recipes.push({
            id: recipeNumber,
            name:
              twist.name +
              " " +
              version.name +
              " " +
              base.name,
            type: base.type,
            category: typeInfo.category,
            emoji: typeInfo.emoji,
            time:
              typeInfo.time +
              twistIndex +
              version.extraTime,
            servings: typeInfo.servings,
            difficulty: typeInfo.difficulty,
            ingredients: typeInfo.ingredients.concat([
              twist.ingredient,
              version.ingredient
            ]),
            steps: typeInfo.steps.concat([
              twist.step,
              version.step
            ])
          });
        });
      });
    });

    console.log("Total recipes:", recipes.length);

    const recipeGrid =
      document.getElementById("recipeGrid");

    const searchInput =
      document.getElementById("searchInput");

    const categoryFilter =
      document.getElementById("categoryFilter");

    const typeFilter =
      document.getElementById("typeFilter");

    const sortSelect =
      document.getElementById("sortSelect");

    const recipeCount =
      document.getElementById("recipeCount");

    const loadMoreButton =
      document.getElementById("loadMoreButton");

    const noResults =
      document.getElementById("noResults");

    const modalBackground =
      document.getElementById("modalBackground");

    const modalContent =
      document.getElementById("modalContent");

    const closeButton =
      document.getElementById("closeButton");

    let visibleRecipeLimit = 120;
    let currentFilteredRecipes = [];

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getFilteredRecipes() {
      const searchText =
        searchInput.value.trim().toLowerCase();

      const selectedCategory =
        categoryFilter.value;

      const selectedType =
        typeFilter.value;

      const selectedSort =
        sortSelect.value;

      let filteredRecipes = recipes.filter(function(recipe) {
        const searchableText = [
          recipe.name,
          recipe.type,
          recipe.category,
          recipe.ingredients.join(" "),
          recipe.steps.join(" ")
        ]
          .join(" ")
          .toLowerCase();

        const matchesSearch =
          searchableText.includes(searchText);

        const matchesCategory =
          selectedCategory === "All" ||
          recipe.category === selectedCategory;

        const matchesType =
          selectedType === "All" ||
          recipe.type === selectedType;

        return (
          matchesSearch &&
          matchesCategory &&
          matchesType
        );
      });

      filteredRecipes.sort(function(a, b) {
        if (selectedSort === "time") {
          return a.time - b.time;
        }

        if (selectedSort === "difficulty") {
          const difficultyOrder = {
            Easy: 1,
            Medium: 2,
            Hard: 3
          };

          return (
            difficultyOrder[a.difficulty] -
            difficultyOrder[b.difficulty]
          );
        }

        return a.name.localeCompare(b.name);
      });

      return filteredRecipes;
    }

    function displayRecipes() {
      currentFilteredRecipes =
        getFilteredRecipes();

      recipeGrid.innerHTML = "";

      recipeCount.textContent =
        "Showing " +
        Math.min(
          visibleRecipeLimit,
          currentFilteredRecipes.length
        ) +
        " of " +
        currentFilteredRecipes.length +
        " matching recipes out of " +
        recipes.length +
        " total recipes";

      if (currentFilteredRecipes.length === 0) {
        noResults.style.display = "block";
        loadMoreButton.style.display = "none";
        return;
      }

      noResults.style.display = "none";

      const recipesToDisplay =
        currentFilteredRecipes.slice(
          0,
          visibleRecipeLimit
        );

      recipesToDisplay.forEach(function(recipe) {
        const card =
          document.createElement("article");

        card.className = "recipe-card";

        card.innerHTML = `
          <div class="recipe-image">
            ${escapeHTML(recipe.emoji)}
          </div>

          <div class="recipe-content">
            <div class="badges">
              <span class="badge">
                ${escapeHTML(recipe.category)}
              </span>

              <span class="badge">
                ${escapeHTML(recipe.type)}
              </span>
            </div>

            <h2>
              ${escapeHTML(recipe.name)}
            </h2>

            <div class="details">
              ⏱ ${escapeHTML(recipe.time)} minutes<br>
              👥 Serves ${escapeHTML(recipe.servings)}<br>
              ⭐ ${escapeHTML(recipe.difficulty)}<br>
              🔢 Recipe #${escapeHTML(recipe.id)}
            </div>

            <button
              class="view-button"
              data-id="${escapeHTML(recipe.id)}"
            >
              View Recipe
            </button>
          </div>
        `;

        recipeGrid.appendChild(card);
      });

      if (
        visibleRecipeLimit <
        currentFilteredRecipes.length
      ) {
        loadMoreButton.style.display = "block";
      } else {
        loadMoreButton.style.display = "none";
      }

      const buttons =
        document.querySelectorAll(".view-button");

      buttons.forEach(function(button) {
        button.addEventListener("click", function() {
          openRecipe(Number(button.dataset.id));
        });
      });
    }

    function openRecipe(recipeId) {
      const recipe = recipes.find(function(item) {
        return item.id === recipeId;
      });

      if (!recipe) {
        return;
      }

      const ingredientList =
        recipe.ingredients
          .map(function(ingredient) {
            return (
              "<li>" +
              escapeHTML(ingredient) +
              "</li>"
            );
          })
          .join("");

      const stepList =
        recipe.steps
          .map(function(step, index) {
            return `
              <li>
                <strong>Step ${index + 1}:</strong>
                ${escapeHTML(step)}
              </li>
            `;
          })
          .join("");

      modalContent.innerHTML = `
        <h2>
          ${escapeHTML(recipe.emoji)}
          ${escapeHTML(recipe.name)}
        </h2>

        <div class="modal-info">
          <strong>Recipe number:</strong>
          ${escapeHTML(recipe.id)}
          <br>

          <strong>Type:</strong>
          ${escapeHTML(recipe.type)}
          <br>

          <strong>Category:</strong>
          ${escapeHTML(recipe.category)}
          <br>

          <strong>Cooking time:</strong>
          ${escapeHTML(recipe.time)} minutes
          <br>

          <strong>Servings:</strong>
          ${escapeHTML(recipe.servings)}
          <br>

          <strong>Difficulty:</strong>
          ${escapeHTML(recipe.difficulty)}
        </div>

        <h3>Ingredients</h3>

        <ul>
          ${ingredientList}
        </ul>

        <h3>Instructions</h3>

        <ol>
          ${stepList}
        </ol>
      `;

      modalBackground.style.display = "flex";
    }

    function closeRecipe() {
      modalBackground.style.display = "none";
    }

    function resetVisibleLimit() {
      visibleRecipeLimit = 120;
      displayRecipes();
    }

    searchInput.addEventListener(
      "input",
      resetVisibleLimit
    );

    categoryFilter.addEventListener(
      "change",
      resetVisibleLimit
    );

    typeFilter.addEventListener(
      "change",
      resetVisibleLimit
    );

    sortSelect.addEventListener(
      "change",
      resetVisibleLimit
    );

    loadMoreButton.addEventListener(
      "click",
      function() {
        visibleRecipeLimit += 120;
        displayRecipes();
      }
    );

    closeButton.addEventListener(
      "click",
      closeRecipe
    );

    modalBackground.addEventListener(
      "click",
      function(event) {
        if (event.target === modalBackground) {
          closeRecipe();
        }
      }
    );

    document.addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Escape") {
          closeRecipe();
        }
      }
    );

    displayRecipes();
  </script>

</body>
</html>
